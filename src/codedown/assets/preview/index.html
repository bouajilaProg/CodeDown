<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>codeDown Preview</title><link rel="stylesheet" href="/workspace.css"><style id="theme-colors"></style></head>
<body>
<header><div><strong>codeDown</strong><span id="filename"></span></div><nav aria-label="Preview controls">
<label>Theme <select id="theme"></select></label>
<label>View <select id="layout"><option value="horizontal">Side by side</option><option value="vertical">Stacked</option><option value="preview">Preview only</option><option value="editor">Editor only</option></select></label>
<button id="reset">Reset split</button><button id="copy-markdown">Copy Markdown</button><button id="download" title="Download the current preview as a PDF" disabled>Download preview</button><button id="reload">Reload file</button>
</nav></header>
<main id="workspace" data-layout="horizontal">
<section id="editor-pane"><div class="pane-title"><label for="editor">Markdown</label><span>Edits stay in this browser</span></div><textarea id="editor" spellcheck="false" aria-label="Markdown editor"></textarea></section>
<div id="divider" role="separator" tabindex="0" aria-label="Resize editor and preview" aria-orientation="vertical" aria-valuemin="15" aria-valuemax="85" aria-valuenow="50"></div>
<section id="preview-pane"><div class="pane-title">Live preview</div><iframe id="preview" title="Rendered Markdown" sandbox="allow-same-origin allow-modals allow-popups"></iframe></section>
</main><footer><span id="status" role="status" aria-live="polite">Loading…</span><span>Drag the divider or use its arrow keys. Double-click to reset.</span></footer>
<script id="config" type="application/json">__CONFIG__</script><script src="/workspace.js" defer></script>
</body></html>
