name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.14"]
        dependencies: [latest]
        include:
          - python: "3.9"
            dependencies: minimum-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libpango1.0-dev libharfbuzz-dev libffi-dev fonts-dejavu-core
      - name: Install package and test tools
        run: |
          if [ "${{ matrix.dependencies }}" = "minimum-cli" ]; then
            # Resolve minimum versions together; downgrading Typer afterward can
            # remove the module shared by the typer and typer-slim distributions.
            python -m pip install '.[dev]' 'typer==0.12.0' 'click==8.1.7'
          else
            python -m pip install '.[dev]'
          fi
          python -m pip check
      - name: Run unit and real PDF integration tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
